server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Hashed build assets can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The chat endpoint streams SSE. Without these, nginx buffers the
        # whole answer and the user stares at nothing until it finishes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Single-page app: unknown paths serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
